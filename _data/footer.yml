# Below is configuration for a small print license statement to add at the bottom of the footer. Can be Markdown
# Will be prefixed by "© {{ site.author }}" if defined in _config.yml
# Will be postfixed by "Powered by GBIF"
# (Disabled by default, remove the '#' lines on the following two lines to enable.)
#license: >
#  Licencia de contenido bajo [Creative Commons Attribution 4.0 License](https://creativecommons.org/licenses/by/4.0/), salvo que se indique lo contrario.
