explore:
  klass: features--explore
  title: Explora los datos
  description: |
    Accede a visualizaciones y herramientas que permiten comprender la distribución territorial de los registros y el crecimiento de la información disponible en el Observatorio.
  features:
    - title: Guía de uso # required
      description: |      # required
        Aprende cómo utilizar las herramientas de búsqueda, filtros y visualización disponibles en el Observatorio.
      href: /resources/usage-guide
      cta:  
      - text: Más información
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/explora_guia_de_uso.png
    - title: Territorio amazónico # required
      description: |      # required
        Explora los registros desde diferentes escalas territoriales de la cuenca amazónica.
      href: /stats/territory
      cta:
      - text: Más información
        href: /stats/territory
        isPrimary: true  
      background: /assets/images/icons/explora_territorio_amazonico.png
    - title: El observatorio en cifras # required
      description: |      # required
        Consulta indicadores del Sistema Ictio sobre monitoreo, participación y construcción colaborativa de conocimiento.
      href: /stats/dashboard
      cta:
      - text: Más información
        href: /stats/dashboard
        isPrimary: true  
      background: /assets/images/icons/explora_obs_cifras.png