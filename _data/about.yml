###################################################

terms-of-use-and-privacy-intro:
  markdownContent: |
    Como el sistema ICTIO es hoy el componente principal del Observatorio, sus términos de uso y su política de privacidad son los que orientan la consulta, la descarga y la reutilización de los datos disponibles en el Observatorio. Se recomienda revisarlos antes de usar la información.

