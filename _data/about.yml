###################################################
### Términos de uso y privacidad. Página terms-of-use-and-privacy.md
###################################################

terms-of-use-and-privacy-intro:
  markdownContent: |
    Como el sistema ICTIO es hoy el componente principal del Observatorio, sus términos de uso y su política de privacidad son los que orientan la consulta, la descarga y la reutilización de los datos disponibles en el Observatorio. Se recomienda revisarlos antes de usar la información.

terms-of-use-and-privacy-cards:
  klass: features--explore
  features:
    - title: Términos de uso y privacidad # required
      description: |      # required
        Condiciones para consultar, descargar, reutilizar y atribuir los datos del sistema ICTIO.
      cta:  
      - text: Ver términos
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/citacion.png
    - title: Política de privacidad del sistema ICTIO # required
      description: |      # required
        Cómo se tratan y protegen los datos de las personas vinculadas a la generación y gestión de información en ICTIO.
      cta:  
      - text: Ver política
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/citacion.png

terms-of-use-and-privacy-outro:
  markdownContent: |
    El Observatorio no publica datos personales. Aun así, la Alianza trabaja para que las organizaciones que generan la información sean reconocidas. La forma de ese reconocimiento depende de los acuerdos locales que cada iniciativa establece en el marco de la Política de ética y gobernanza de datos. Cuando un trabajo requiere información con mayor nivel de detalle, el procedimiento se describe en la sección de Acceso a datos sensibles, que explica cómo presentar la solicitud a la Secretaría Técnica.

