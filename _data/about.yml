###################################################
### Observatorio. Página observatory.md
###################################################

observatory-intro:
  markdownContent: |
    # La ventana de datos abiertos de la Alianza Aguas Amazónicas

    Cada día, en ríos, lagos, mercados y puertos de la Amazonía, alguien registra un pez. Una pescadora anota su captura al volver de la faena, un monitor comunitario documenta un desembarque, un equipo técnico recorre un mercado. Cada uno de esos registros, por pequeño que parezca, es una pieza para entender cómo cambia el ecosistema acuático más grande del planeta. El Observatorio Aguas Amazónicas reúne esas piezas y las pone a disposición de todas las personas.

    El Observatorio es la ventana de datos abiertos de la Alianza Aguas Amazónicas: el lugar donde la información que la Alianza genera y cuida se vuelve pública, consultable y reutilizable. Hoy su componente principal es el sistema ICTIO, que reúne los datos del monitoreo pesquero de la cuenca. Esos datos provienen de monitoreo participativo y comunitario, de programas de ciencia ciudadana y de los monitoreos que realizan las más de 30 organizaciones e instituciones que forman parte de la Alianza. En el futuro, la ventana se abrirá a otros componentes que la Alianza monitorea y estudia, como la calidad del agua.

    Abrir los datos no significa exponer a quienes los generan. Por eso, la información del Observatorio se publica agregada a nivel de subcuenca, sin coordenadas exactas, para proteger sitios y recursos sensibles, y se anonimiza cuando es necesario para proteger los datos personales. Al mismo tiempo, la Alianza trabaja para que las organizaciones locales que producen la información sean reconocidas y citadas en cada uso de sus datos. Proteger y reconocer van de la mano.

    ## ¿Por qué monitorear la pesca en la Amazonía?

    Los peces son la base de la alimentación, la economía y la cultura de millones de personas en la cuenca amazónica. Algunas especies, como los grandes bagres migratorios, recorren miles de kilómetros entre los Andes y el estuario, conectando países y ecosistemas. Saber qué especies se pescan, dónde, cuándo y en qué cantidad permite detectar cambios a tiempo, sustentar decisiones de manejo y conservación, y fortalecer la voz de las comunidades pesqueras en esas decisiones.

    ## La Alianza Aguas Amazónicas

    La Alianza Aguas Amazónicas es una iniciativa regional que concibe la cuenca amazónica como un gran ecosistema acuático interconectado, que depende de sus bosques para mantener su integridad. Más de 30 organizaciones de los países de la cuenca trabajan juntas para conservar sus ríos, humedales y pesquerías, con la Wildlife Conservation Society (WCS) como Secretaría Técnica. La estrategia, los programas, los socios y el resto del contexto de la Alianza están en su sitio web.

    [Conocer la Alianza](https://aguasamazonicas.org/la-alianza){:.button .is-primary target="_blank"}

    ## Los socios

    El Observatorio se construye de manera colaborativa junto a organizaciones, instituciones y socios de la Alianza que aportan datos, investigaciones y conocimiento sobre los ríos y ecosistemas amazónicos. Esta red de colaboración permite consolidar información diversa y actualizada para fortalecer el análisis, la toma de decisiones y las acciones de conservación en la Amazonía.

    <img class="center" src="/assets/images/logos/banner-socios-Alianza-AA-2025-es.png" alt="Socios">

###################################################
### Ética y gobernanza de datos. Página governance.md
###################################################

governance-intro:
  markdownContent: |
    # Acuerdos compartidos para cuidar los datos y a quienes los generan
    La gobernanza del Observatorio hace parte de la gobernanza general de la Alianza Aguas Amazónicas. Las mismas instancias que orientan la Alianza definen cómo se gestiona y cómo opera el Observatorio: la **Asamblea General**, que reúne a los socios y recibe la rendición de cuentas; el **Consejo Directivo**, que aprueba las políticas y resuelve las decisiones institucionales; el **Comité de Infraestructura de Datos**, que asesora en arquitectura, interoperabilidad, calidad y seguridad; el **Comité de Conducta**, que examina con imparcialidad los casos que afecten derechos, dignidad o confianza; y la **Secretaría Técnica**, a cargo de la Wildlife Conservation Society (WCS), que coordina la aplicación cotidiana. En cada iniciativa, las personas gestoras de datos mantienen el enlace entre el territorio y la Secretaría Técnica.

    Esta gobernanza parte de una idea: la autoridad sobre un dato nace donde el dato se genera. Cada comunidad, iniciativa y organización socia conserva la gobernanza sobre sus datos, y la Alianza la complementa sin reemplazarla.

    ## Una política para todos los que usan los datos

    La Política de ética y gobernanza de datos rige a todas las instituciones que forman parte de la Alianza y, a la vez, ofrece lineamientos para cualquier persona que use el Observatorio o sus datos. Establece los principios, compromisos y responsabilidades que acompañan a la información en todo su ciclo de vida, desde que se registra hasta que se publica, se usa y se conserva.

    Los datos que integra el Observatorio llegan por dos vías. La mayoría se publica directamente a través de la Alianza Aguas Amazónicas, que asegura la trazabilidad, el reconocimiento, el consentimiento y los acuerdos con las comunidades. Otros provienen de publicadores que reconocen estos mismos principios y se adhieren a ellos.

    La Alianza está comprometida a trabajar bajo los principios FAIR, para que los datos sean localizables, accesibles, interoperables y reutilizables, y bajo los principios CARE, que reconocen el beneficio colectivo, la autoridad para controlar, la responsabilidad y la ética en el uso de datos de pueblos indígenas y comunidades locales. Esta combinación orienta lo que la política llama apertura situada: abrir los datos tanto como sea posible, teniendo en cuenta los derechos, los territorios, las relaciones de confianza y los riesgos de su divulgaciónica.

