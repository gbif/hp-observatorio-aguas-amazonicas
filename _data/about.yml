terms-of-use-and-privacy-outro:
  markdownContent: |
    El Observatorio no publica datos personales. Aun así, la Alianza trabaja para que las organizaciones que generan la información sean reconocidas. La forma de ese reconocimiento depende de los acuerdos locales que cada iniciativa establece en el marco de la Política de ética y gobernanza de datos. Cuando un trabajo requiere información con mayor nivel de detalle, el procedimiento se describe en la sección de Acceso a datos sensibles, que explica cómo presentar la solicitud a la Secretaría Técnica.

###################################################
### FAQ. Página faq.md
###################################################

faq-intro:
  markdownContent: |
    # Respuestas rápidas sobre el Observatorio, sus datos y las formas de participar

    ## ¿Qué es el Observatorio Aguas Amazónicas?

    Es la ventana de datos abiertos de la Alianza Aguas Amazónicas. Reúne y pone a disposición información sobre peces, pesca y ecosistemas acuáticos de la cuenca amazónica. Hoy su componente principal es el sistema ICTIO de monitoreo pesquero.

    ## ¿Qué información ofrece el Observatorio?

    Registros biológicos de peces, conjuntos de datos, paneles de cifras, un mapa de la cuenca por subcuencas y fichas de especies prioritarias, además de guías y documentos sobre el uso y la gestión de los datos.

    ## ¿De dónde provienen los datos?

    Del monitoreo participativo y comunitario, de programas de ciencia ciudadana y de los monitoreos de las organizaciones e instituciones socias de la Alianza, siguiendo los protocolos de monitoreo pesquero de ICTIO.

    ## ¿Por qué los registros no muestran coordenadas exactas?

    Para proteger sitios, especies y personas, los datos públicos se presentan agregados a nivel de subcuenca y sin datos personales. Cuando un fin legítimo requiere más detalle, puede solicitarse acceso según lo descrito en Acceso a datos sensibles.

    ## ¿De dónde proviene la información geográfica sobre las cuencas?

    La división en subcuencas que usa el Observatorio se basa en la clasificación geográfica desarrollada por la Alianza Aguas Amazónicas. Las principales cuencas se describen en el [sitio web de la Alianza](https://aguasamazonicas.org/cuencas).

    ## ¿Son confiables los datos del monitoreo participativo?

    Sí. Cada aporte pasa por revisión local de las personas gestoras de datos y por la curaduría de la Secretaría Técnica, que incluye validación taxonómica, geográfica y temporal. El proceso se describe en Calidad de datos.

    ## ¿Con qué frecuencia se actualiza la información?

    La información se actualiza a medida que se integran y publican nuevos conjuntos de datos o nuevas versiones. Cada conjunto indica su fecha de publicación y su versión.

    ## ¿Es posible descargar los datos?

    Sí. Las descargas se hacen a través de GBIF, con una [cuenta gratuita](https://www.gbif.org/user/login). Desde las páginas de registros, la opción «Descargar» redirige a GBIF.org y conserva los filtros aplicados en el Observatorio.

    ## ¿Cómo se citan los datos?

    Los registros, conjuntos de datos y sus productos derivados se citan según los lineamientos de la Guía de citación, atribución y reconocimiento.

    ## ¿Es necesario notificar el uso de los datos?

    La Alianza invita a hacerlo. El enlace y el DOI del producto se envían a [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org), lo que permite devolver los resultados a quienes generaron la información.

    ## ¿Por qué las cifras de los Informes ICTIO no coinciden con las del Observatorio?

    Los informes tienen su propio nivel de agregación y, en algunos casos, incorporan fuentes complementarias. Ambos productos son válidos y se complementan. Más detalles en [Informes ICTIO](/resources/ictio-reports).

    ## ¿Cómo puede una organización compartir datos?

    Las organizaciones socias de la Alianza rellenan las plantillas de registros biológicos y de metadatos y las envían a la Secretaría Técnica. El paso a paso está en la Guía de publicación. Las organizaciones que no son socias y desean aportar datos pueden escribir a [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org).

    ## ¿Qué son los protocolos P76, P77, P78 y P79?

    Son los cuatro protocolos de monitoreo pesquero de ICTIO: durante la faena, después de la faena, en mercado y en puerto. Se describen en Protocolos de colecta.

    ## ¿Es posible integrar los datos en otros sistemas?

    Sí, mediante la [API para desarrolladores](/resources/api-access), que permite consultar los datos publicados de forma automática.

    ## ¿Cómo se reporta un error o se hace una consulta?

    Los reportes y consultas se reciben en [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org). Cada error reportado contribuye a mejorar la información.

    ## ¿Dónde encontrar más información sobre la Alianza Aguas Amazónicas?

    En [aguasamazonicas.org](https://aguasamazonicas.org/) se presentan su estrategia, sus programas, sus socios y el Programa de Ciencia Ciudadana.