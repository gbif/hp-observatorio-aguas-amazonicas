        Standard for documenting dataset metadata: origin, methods, coverage, responsible parties, and license.
      cta:
      - text: More information
        href: https://eml.ecoinformatics.org/
        isPrimary: true  
        blankTarget: true      
      background: /assets/images/icons/estandar_eml.png
    - title: Plinian Core (PliC) # required
      description: |      # required
