###################################################
### Protocols. Page /en/resources/protocols.md
###################################################

protocols-intro:
  markdownContent: |
    # Shared agreements to observe and record fisheries across the basin

    For data collected in rivers, markets, and ports of different countries to be comparable, there first needs to be agreement on what to observe and how to record it. In the Amazon Waters Alliance, that agreement is built collaboratively by the Fisheries Group, an interinstitutional group that defines the essential variables recorded across the Alliance’s different monitoring mechanisms.

    From that work come the four ICTIO system protocols. Each responds to a different moment in the fisheries chain and, together, they offer a broader view of fish diversity in the basin and of fisheries dynamics.

    Each protocol responds to a specific observation and recording context, making it possible to complement information obtained from different points in the fisheries chain:

protocols-cards:
  klass: features--explore
  features:
    - title: P76 – During the fishing trip # required
      description: |      # required
        Records fish observed or captured directly during fishing activity. Documents information from the moment of capture, such as location, date, and event characteristics when available.     
      # img required
      background: /assets/images/icons/protocolo_p76.png
    - title: P77 – After the fishing trip # required
      description: |      # required
        Records information reported once fishing activity has ended. Data are contributed by fishers, monitors, or local teams, and complement what was obtained during monitoring sessions.
      background: /assets/images/icons/protocolo_p77.png
    - title: P78 – Market # required
      description: |      # required
        Records species observed or traded in fish markets. Makes it possible to know the diversity of species circulating in trade, although the exact place of capture cannot always be determined.
      background: /assets/images/icons/protocolo_p78.png
    - title: P79 – Port # required
      description: |      # required
        Records information obtained at ports and fish landings. Depending on available information, it contributes data on catch origin, landed species, and other aspects of fishing activity.
      background: /assets/images/icons/protocolo_p79.png

protocols-files-link:
  markdownContent: |
    [View protocols](https://aguasamazonicas.org){:.button .is-primary target="_blank"}

###################################################
### Sensitive data access. Page /en/resources/sensitive-information.md
###################################################

sensitive-information-intro:
  markdownContent: |
    # As open as possible, as protected as necessary

    ICTIO system data do not exist in a single version. Some details, such as the exact coordinates of a fishing site or the identity of who recorded a catch, could affect people, communities, or species if published without care. That is why ICTIO organizes its data into four access levels. Each level is a different version of the same resource, and opening a level never happens automatically.

sensitive-information-cards:
  klass: features--explore
  features:
    - title: ICTIO system data access levels # required
      description: |      # required
        Complete model of access levels, storage, and licensing, with allowed transitions between levels.   
      cta:
      - text: Download
        href: https://drive.google.com/file/d/1HSJO-xewnXEIf7xCMMok7xXv-e0vmc1K/view
        isPrimary: true  
        blankTarget: true      
      background: /assets/images/icons/uso_privacidad.png

sensitive-information-howto:
  markdownContent: |
    ## How to access sensitive ICTIO system data?

    When research, a conservation project, or a technical analysis requires more detail than is publicly available, it is possible to request access to level 2, that is, the dataset with record coordinates. Interested people or organizations must send a formal request to the Amazon Waters Alliance Technical Secretariat at [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org), using the [Data sharing agreement](/en/resources/use-guide) form.

    The Technical Secretariat reviews each request together with the data custodian when appropriate. If approved, access is formalized with an agreement that defines purpose, scope, duration, security measures, and redistribution restrictions. If it cannot be approved, the decision is communicated with reasons.

    Accessing level 2 data carries the same recognition commitments as any use of the Observatory, and some additional ones. Before submitting a request, it is recommended to review [section 2.3 of the Citation guide / Data use](https://drive.google.com/file/d/1DLUyBLAFsUnfi8f6_C6zhdy2FyohZTPM/view), which explains how to cite the dataset and its DOI, how to recognize the organizations and communities that generated the information, and how to notify use and reuse of the resulting products.
 
sensitive-information-howto-cards:
  klass: features--explore
  features:
    - title: Data sharing agreement at initiative or organization level # required
      description: |      # required
        Form to request and formalize access to controlled-access data.   
      cta:
      - text: Download
        href: /en/resources/usage-guide
        blankTarget: true      
        isPrimary: true  
      background: /assets/images/icons/protocolo_p76.png  

###################################################
### ICTIO Reports. Page /en/resources/ictio-reports.md
###################################################

ictio-reports-intro:
  markdownContent: |
    # A panoramic view of fisheries monitoring in the Amazon basin

    The ICTIO Reports are the Amazon Waters Alliance Technical Secretariat’s reading of the state of fisheries monitoring in the basin. Drawing on ICTIO system data, they bring together figures, trends, and progress, and make visible the contributions of the communities, organizations, and institutions that generate the information. They have an outreach purpose, which is why they are presented in formats designed for sharing, such as infographics and periodic reports.

    The reports work with their own aggregation level and, in some cases, incorporate complementary data sources beyond those in the Observatory. That is why their figures do not always match the Observatory dashboards. Both products are valid and complementary: the Observatory shows published, queryable records; the reports offer an overall reading to understand the fisheries monitoring landscape.

    ICTIO Reports are published on the [Amazon Waters Alliance](https://aguasamazonicas.org/informe-ictio){:target="_blank"} website.

ictio-reports-cards:
  klass: features--explore
  features:
    - title: ICTIO Reports # required
      description: |      # required
        ICTIO fisheries monitoring reports and infographics, available for consultation and download.   
      cta:
      - text: View reports
        href: https://aguasamazonicas.org/informe-ictio
        blankTarget: true      
        isPrimary: true  
      background: /assets/images/icons/descubre_conjunto_datos.png

###################################################
### API for developers. Page api-access.md
###################################################

api-access-intro:
  markdownContent: |
    # Integrating Observatory data into systems, applications, and visualizations

    The API allows partner organizations, technical teams, and developers to query data published in the Observatory automatically, without manual downloads. Through it, biodiversity and fisheries monitoring information from the ICTIO system can be accessed and integrated into self-updating dashboards, reproducible analyses, or cross-checks with other basin sources.

    The technical documentation presents available endpoints, query examples, and guidelines for using the API. Data queried this way keep the same terms of use and citation as the rest of the Observatory.

    [View API documentation](https://techdocs.gbif.org/en/openapi/v1/occurrence){:.button .is-primary target="_blank"}

