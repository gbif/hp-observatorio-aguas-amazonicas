###################################################
### User guide. Page /en/resources/use-guide.md
###################################################

use-guide-intro:
  markdownContent: |
    # Tools and guidance to explore, query, and make the most of the Observatory

    The Amazon Waters Observatory lets you explore information on fish, fisheries, and aquatic ecosystems of Amazonia through different entry points: the search tool, indicator dashboards, the basin map, fish fact sheets, and datasets. Exploration can start from a species, a sub-basin, or the organization that contributed the data, and visualizations update according to the filters applied.

    Selected information is downloaded through GBIF with a free account, and the filters applied in the Observatory are kept in the download. The user guide explains each tool step by step; the visual style guide supports correct use of the Observatory’s identity in materials and communications.

