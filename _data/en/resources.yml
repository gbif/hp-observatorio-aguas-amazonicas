###################################################
### Citation guide. Page /en/resources/citation.md
###################################################

citation-guide-intro:
  markdownContent: |
    # Recognizing those who make every datum possible

    Behind every Observatory record are fishers and monitors, communities, partner organizations, and technical teams who observed, recorded, validated, and cared for the information. Citing well is not a bibliographic formality: it is how that chain of contributions stays visible, how others can verify results, and how value is returned to those who generated the data.

    ## Citation, attribution, and recognition guide

    The guide explains how to cite each type of resource available in the Observatory: the Observatory itself, an individual record, a dataset, a download, a derived dataset, a photograph, a map or a dashboard figure, and derived products created from them. Its central rule is to cite the exact resource that was used. Mentioning the Alliance, the Observatory, ICTIO, or GBIF does not replace citing the dataset or download from which the data come.

citation-guide-cards:
  klass: features--explore
  features:
    - title: Citation, attribution, and recognition guide # required
      description: |      # required
        Guidance for citing Alliance data, datasets, downloads, and products, and for recognizing the contributions of people, communities, and organizations.
      cta:  
      - text: Download guide
        href: https://drive.google.com/file/d/11GLuuW1eJLsD8jIUovcVH1_caOqSD9c7/view
        isPrimary: true 
        blankTarget: true     
      # img required
      background: /assets/images/icons/citacion.png

citation-guide-datause:
  markdownContent: |
    ## Data use: notification of use and reuse

    The Alliance invites notification when articles, reports, maps, visualizations, educational materials, software, or other products based on Observatory data are published. Knowing how the data are used allows the Alliance to return results to the communities and organizations that made them possible.

    Notifications are sent to [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org) with the following information:

    - title, product type, public link, and DOI, if available;
    - authorship, responsible organization, and contact;
    - data or resources used, with their version or DOI;
    - a brief description of the use made.

    One notification per product is enough. Restricted data or personal information should not be attached. Notification is a good reciprocity practice: it does not replace citation and is not a condition for accessing or using the data.

###################################################
### Data quality. Page /en/resources/data-quality.md
###################################################

data-quality-intro:
  markdownContent: |
    # Participatory data with curation processes that support their reliability

    ## What does data quality mean in the Amazon Waters Alliance?

    Much of the Observatory’s data comes from participatory monitoring: fishers who record their catches, community monitors, local teams in markets and ports, and partner organizations with their own fisheries monitoring programs. That a datum comes from a participatory process does not make it less reliable. What makes it reliable is the review path it follows before publication, and in the Alliance that path involves several hands.

    The first review happens in the territory, where data managers in each initiative check that records are complete and well documented. Then the Alliance Technical Secretariat curates each contribution: it characterizes the set, normalizes formats, detects duplicates, and applies taxonomic validation to confirm that scientific names exist and correspond to accepted taxa, always retaining the original identification and local names. It also applies geographic validation to check that locations are consistent with the declared water body and territory, and temporal validation to ensure dates are possible and consistent. When needed, review by thematic specialists is added.

    The Alliance assesses quality across three dimensions: accuracy, consistency, and completeness. And it follows one principle: quality is not fixed by deleting. A record with problems is documented, correction is attempted together with who contributed it, and it is classified by fitness for use, but it is not silently erased. Every transformation is recorded so that each published datum can be explained.

    Quality is also not a yes or no. A record may be useful for one analysis and not for another. That is why it is recommended to review each dataset’s metadata, which describe its methodology, coverage, and applied protections; for example, public locations are aggregated at the sub-basin level and do not represent exact coordinates.

    ## Tools for data quality

    **For those who use the data.** Before analysis, it is advisable to review the dataset metadata and the quality flags GBIF assigns to each record. These flags indicate, for example, names that do not match the taxonomic catalog or inconsistent coordinates, and allow records to be filtered according to the purpose of the analysis.

    - [GBIF data quality requirements](https://www.gbif.org/data-quality-requirements): what is expected of a published occurrence dataset.
    - [GBIF species name lookup](https://www.gbif.org/tools/species-lookup): checks scientific names against the taxonomic catalog.

    **For those who generate or publish data.** These free tools help review data before sending them to the Technical Secretariat:
    
    - [GBIF data validator](https://tools.gbif.org/tools/data-validator): checks Darwin Core structure and detects issues before publishing.
    - [openRefine](https://openrefine.org/): checks the structure and content of EML files.
    - [Alliance interoperability guide](https://drive.google.com/file/d/1DLUyBLAFsUnfi8f6_C6zhdy2FyohZTPM/view) (see section 2.2): describes the controls applied to each contribution.

    [More quality tools](https://biodiversidad.co/recursos/calidad-de-datos/){:.button .is-primary target="_blank"}

data-quality-standards:
  markdownContent: |
    ## Standards

    Standards are the shared language that makes it possible to integrate data from different countries, organizations, and methodologies into one infrastructure. The Observatory uses three:

