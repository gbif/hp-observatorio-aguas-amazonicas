###################################################
### Discover. Page en/taxa/discover.md
###################################################

discover-intro:
  markdownContent: |
    The Amazon basin hosts an extraordinary diversity of organisms that play fundamental roles in aquatic and terrestrial ecosystems. From broad taxonomic groups to species of special interest for conservation and monitoring, each contributes valuable information for understanding biodiversity, ecological dynamics, and the processes that connect Amazonian territories.

    As part of its efforts to strengthen the generation, integration, and sharing of knowledge about the region, the Amazon Waters Alliance prioritizes a set of fish families, genera, and species of particular relevance to monitoring, research, and conservation processes in the basin.

    In this section you can access both the dataset that documents the fact sheets for these taxa and the list of fact sheets and the biological description of each taxon.

