##########################################################################
### Contents for pages under /taxa, in the order they appear
### in the navigation menu under Taxa.
###
### Defined in _data/en/taxa.yml
### Each section is named by page and content type.
### For example:
### for discover.md: discover-intro, discover-cards, etc.
### Content types:
### -intro: introductory markdown content
### -cards: features/cards content
### -links: links/buttons content
