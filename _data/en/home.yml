welcome:
  reverse: true
  klass: splitBanner--welcome
  title: Discover the life of Amazonian rivers
  description: |
      Discover some of the species and families of fish most representative of the Amazonian aquatic ecosystems.
  background: /assets/images/icons/descubre_fichas_especies.png
  cta: 
    - text: View fish cards
      href: /en/taxa/discover

explore:
  klass: features--explore
  title: Explore the data
  description: |
    Access visualizations and tools that allow you to understand the territorial distribution of records and the growth of information available in the Observatory.
  features:
    - title: Usage guide # required
      description: |      # required
        Learn how to use the search, filters and visualization tools available in the Observatory.
      cta:  
      - text: →
        href: /en/resources/use-guide
        isPrimary: true
        klass: button--arrow
      # img required
      background: /assets/images/icons/explora_guia_de_uso.png
    - title: Amazonian territory # required
      description: |      # required
        Explore records from different territorial scales of the Amazon basin.
      cta:
      - text: →
        href: /en/occurrence/search?view=dashboard&layout=map_table
        isPrimary: true
        klass: button--arrow
      background: /assets/images/icons/explora_territorio_amazonico.png
    - title: The Observatory in numbers # required
      description: |      # required
        Explore indicators on participation, monitoring, and collective construction of information.
      cta:
      - text: →
        href: /en/occurrence/search?view=dashboard&layout=table_stateProvince_iucn*taxa.rank-SPECIES_gallery*map.h-500_year_occurrenceSummary_institutionCode
        isPrimary: true
        klass: button--arrow
      background: /assets/images/icons/explora_obs_cifras.png