terms-of-use-and-privacy-outro:
  markdownContent: |
    The Observatory does not publish personal data. Even so, the Alliance works so that the organizations that generate the information are recognized. How that recognition is given depends on the local agreements each initiative establishes under the Data Ethics and Governance Policy. When a project requires more detailed information, the procedure is described in the Sensitive data access section, which explains how to submit a request to the Technical Secretariat.

###################################################
### FAQ. Page /en/faq.md
###################################################

faq-intro:
  markdownContent: |
    # Quick answers about the Observatory, its data, and ways to participate

    ## What is the Amazon Waters Observatory?

    It is the open data window of the Amazon Waters Alliance. It brings together and makes available information on fish, fisheries, and aquatic ecosystems of the Amazon basin. Today its main component is the ICTIO fisheries monitoring system.

    ## What information does the Observatory provide?

    Biological fish records, datasets, indicator dashboards, a basin map by sub-basins, and priority species fact sheets, as well as guides and documents on data use and management.

    ## Where do the data come from?

    From participatory and community monitoring, citizen science programs, and monitoring by Alliance partner organizations and institutions, following ICTIO fisheries monitoring protocols.

    ## Why do records not show exact coordinates?

    To protect sites, species, and people, public data are presented aggregated at the sub-basin level and without personal data. When a legitimate purpose requires more detail, access may be requested as described in Sensitive data access.

    ## Where does the geographic information on basins come from?

    The sub-basin division used by the Observatory is based on the geographic classification developed by the Amazon Waters Alliance. The main basins are described on the [Alliance website](https://aguasamazonicas.org/cuencas){:target="_blank"}.

    ## Are participatory monitoring data reliable?

    Yes. Each contribution goes through local review by data managers and curation by the Technical Secretariat, including taxonomic, geographic, and temporal validation. The process is described in Data quality.

    ## How often is the information updated?

    Information is updated as new datasets or new versions are integrated and published. Each dataset indicates its publication date and version.

    ## Is it possible to download the data?

    Yes. Downloads are made through GBIF, with a [free account](https://www.gbif.org/user/login){:target="_blank"}. From the occurrence pages, the “Download” option redirects to GBIF.org and keeps the filters applied in the Observatory.

    ## How are the data cited?

    Records, datasets, and their derived products are cited according to the Citation, attribution, and recognition Guide.

    ## Is it necessary to notify data use?

    The Alliance invites you to do so. The product link and DOI are sent to [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org){:target="_blank"}, which helps return results to those who generated the information.

    ## Why do ICTIO Report figures not match those in the Observatory?

    The reports have their own aggregation level and, in some cases, incorporate complementary sources. Both products are valid and complementary. More details in [ICTIO Reports](/en/resources/ictio-reports){:target="_blank"}.

    ## How can an organization share data?

    Alliance partner organizations fill in the biological records and metadata templates and send them to the Technical Secretariat. The step-by-step process is in the Publishing guide. Organizations that are not partners and wish to contribute data can write to [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org){:target="_blank"}.

    ## What are protocols P76, P77, P78, and P79?

    They are the four ICTIO fisheries monitoring protocols: during the fishing trip, after the fishing trip, at market, and at port. They are described in Collection protocols.

    ## Is it possible to integrate the data into other systems?

    Yes, through the [API for developers](/en/resources/api-access){:target="_blank"}, which allows published data to be queried automatically.

    ## How is an error reported or a question asked?

    Reports and questions are received at [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org){:target="_blank"}. Each reported error helps improve the information.

    ## Where can I find more information about the Amazon Waters Alliance?

    At [aguasamazonicas.org](https://aguasamazonicas.org/){:target="_blank"} you will find its strategy, programs, partners, and the Citizen Science Program.
