###################################################
### Observatory. Page /en/observatory.md
###################################################

observatory-intro:
  markdownContent: |
    # The open data window of the Amazon Waters Alliance

    Every day, in rivers, lakes, markets, and ports across Amazonia, someone records a fish. A fisher notes their catch after returning from the fishing trip, a community monitor documents a landing, a technical team surveys a market. Each of those records, however small it may seem, is a piece for understanding how the planet’s largest aquatic ecosystem is changing. The Amazon Waters Observatory brings those pieces together and makes them available to everyone.

    The Observatory is the open data window of the Amazon Waters Alliance: the place where the information the Alliance generates and stewards becomes public, searchable, and reusable. Today its main component is the ICTIO system, which brings together fisheries monitoring data from the basin. Those data come from participatory and community monitoring, citizen science programs, and the monitoring carried out by the more than 30 organizations and institutions that make up the Alliance. In the future, the window will open to other components the Alliance monitors and studies, such as water quality.

    Opening data does not mean exposing those who generate it. That is why Observatory information is published aggregated at the sub-basin level, without exact coordinates, to protect sensitive sites and resources, and is anonymized when needed to protect personal data. At the same time, the Alliance works so that the local organizations that produce the information are recognized and cited in every use of their data. Protection and recognition go hand in hand.

    ## Why monitor fisheries in Amazonia?

    Fish are the foundation of food, livelihoods, and culture for millions of people in the Amazon basin. Some species, such as the large migratory catfish, travel thousands of kilometers between the Andes and the estuary, connecting countries and ecosystems. Knowing which species are fished, where, when, and in what quantity makes it possible to detect changes in time, support management and conservation decisions, and strengthen the voice of fishing communities in those decisions.

    ## The Amazon Waters Alliance

    The Amazon Waters Alliance is a regional initiative that conceives the Amazon basin as a large interconnected aquatic ecosystem that depends on its forests to maintain its integrity. More than 30 organizations from the basin’s countries work together to conserve its rivers, wetlands, and fisheries, with the Wildlife Conservation Society (WCS) as Technical Secretariat. The Alliance’s strategy, programs, partners, and broader context are on its website.

    [Learn about the Alliance](https://aguasamazonicas.org/la-alianza){:.button .is-primary target="_blank"}

    ## Partners

    The Observatory is built collaboratively with organizations, institutions, and Alliance partners that contribute data, research, and knowledge about Amazonian rivers and ecosystems. This collaboration network helps consolidate diverse, up-to-date information to strengthen analysis, decision-making, and conservation actions in Amazonia.

    <img class="center" src="/assets/images/logos/banner-socios-Alianza-AA-2025-es.png" alt="Partners">

###################################################
### Data ethics and governance. Page /en/governance.md
###################################################

governance-intro:
  markdownContent: |
    # Shared agreements to care for data and those who generate it
    Observatory governance is part of the overall governance of the Amazon Waters Alliance. The same bodies that guide the Alliance define how the Observatory is managed and operated: the **General Assembly**, which brings partners together and receives accountability reports; the **Board of Directors**, which approves policies and resolves institutional decisions; the **Data Infrastructure Committee**, which advises on architecture, interoperability, quality, and security; the **Conduct Committee**, which impartially examines cases that affect rights, dignity, or trust; and the **Technical Secretariat**, led by the Wildlife Conservation Society (WCS), which coordinates day-to-day implementation. In each initiative, data managers maintain the link between the territory and the Technical Secretariat.

    This governance starts from one idea: authority over a datum arises where the datum is generated. Each community, initiative, and partner organization retains governance over its data, and the Alliance complements that governance without replacing it.

    ## A policy for everyone who uses the data

    The Data Ethics and Governance Policy applies to all institutions that are part of the Alliance and, at the same time, offers guidance for anyone who uses the Observatory or its data. It sets out the principles, commitments, and responsibilities that accompany information throughout its life cycle, from the moment it is recorded until it is published, used, and preserved.

    The data the Observatory integrates arrive through two channels. Most are published directly through the Amazon Waters Alliance, which ensures traceability, recognition, consent, and agreements with communities. Others come from publishers that recognize these same principles and adhere to them.

    The Alliance is committed to working under the FAIR principles, so that data are findable, accessible, interoperable, and reusable, and under the CARE principles, which recognize collective benefit, authority to control, responsibility, and ethics in the use of data from Indigenous peoples and local communities. This combination guides what the policy calls situated openness: opening data as much as possible, while taking into account rights, territories, relationships of trust, and the risks of disclosure.

