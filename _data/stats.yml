monitoring-after:
  markdownContent: |
    Para realizar consultas más específicas, acceda al panel dinámico mediante el botón "[Ver datos en el panel dinámico](/occurrence/search?view=dashboard)". Allí podrá aplicar filtros adicionales, seleccionar especies de interés y explorar de forma interactiva la información asociada a su distribución, registros e instituciones participantes.

    [Ver datos en el panel dinámico](/occurrence/search?view=dashboard){:.button}

data-after:
  markdownContent: |
    Para profundizar en la exploración de la información, acceda al panel dinámico mediante el botón "[Ver datos en el panel dinámico](/occurrence/search?view=dashboard)". Allí podrá consultar con mayor detalle las organizaciones participantes, los conjuntos de datos publicados, los eventos y procesos de monitoreo registrados, las metodologías implementadas y los recursos multimedia asociados a la información disponible en el Observatorio. Las visualizaciones se actualizan dinámicamente según los filtros aplicados, permitiendo explorar diferentes dimensiones de la construcción colaborativa de conocimiento en la cuenca amazónica.

    Los indicadores presentados reflejan el crecimiento y fortalecimiento progresivo del Observatorio como un espacio de integración, publicación y acceso a información sobre la biodiversidad y los ecosistemas amazónicos. La diversidad de organizaciones participantes, conjuntos de datos, metodologías de monitoreo y recursos asociados evidencia el carácter colaborativo de la iniciativa y la importancia de la articulación entre distintos actores para ampliar el conocimiento disponible sobre la región. Los resultados observados deben interpretarse como una representación de la información actualmente publicada y disponible para consulta dentro del Observatorio

    [Ver datos en el panel dinámico](/occurrence/search?view=dashboard){:.button}