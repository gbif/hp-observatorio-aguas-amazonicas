###################################################
### Publicação de dados. Página publishing-guide.md
###################################################

publishing-guide-intro:
  markdownContent: |
    # Como os dados das organizações parceiras chegam ao Observatório e ao mundo

    A interoperabilidade permite que os conjuntos de dados produzidos por distintas organizações, com métodos, escalas e ferramentas diferentes, sejam integrados, interpretados e reutilizados de forma conjunta. Na Aliança Águas Amazônicas, ela é abordada em quatro dimensões: legal (licenças, condições de uso e acordos), organizacional (papéis e responsabilidades), semântica (padrão comum, vocabulários controlados e metadados) e técnica (formatos abertos, identificadores persistentes e acesso programático). O modelo não centraliza a informação nem homogeneiza as práticas de campo: cada organização conserva a titularidade e o controle sobre seus dados, e sua contribuição fica rastreada ao longo de todo o ciclo.

    ## Ciclo da informação: da organização parceira ao GBIF

    Todo registro publicado no Observatório passa por seis etapas:

    1. Compartilhar. A organização parceira entrega o conjunto estruturado na planilha Darwin Core, com seus metadados e a declaração de licença, restrições e informação sensível.
    2. Custodiar. A Secretaria Técnica verifica a validade formal do aporte e conserva o original sem modificações e com acesso restrito (nível 0).
    3. Integrar. O aporte é incorporado ao conjunto interno cumulativo, conservando o identificador do aporte, a organização de origem e a data de recebimento.
    4. Validar. Aplicam-se perfilamento, normalização, validação taxonômica, geográfica e temporal, e detecção de duplicados; cada transformação é documentada.
    5. Proteger. Anonimizam-se os dados pessoais e generaliza-se a localização ao nível de sub-bacia, o que gera versões de acesso controlado (níveis 1 e 2).
    6. Publicar. Com a autorização da Secretaria Técnica, gera-se a versão de acesso aberto (nível 3).

publishing-guide-cards:
  klass: features--explore
  features:
    - title: Guia de interoperabilidade # required
      description: |      # required
        Diretrizes da Aliança para compartilhar, padronizar, validar, proteger e preparar conjuntos de dados para o acesso aberto.
      cta:  
      - text: Baixar guia
        href: https://drive.google.com/file/d/1DLUyBLAFsUnfi8f6_C6zhdy2FyohZTPM/view
        isPrimary: true 
        blankTarget: true     
