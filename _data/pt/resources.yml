### Guia de uso. Página use-guide.md
###################################################

use-guide-intro:
  markdownContent: |
    # Ferramentas e orientações para percorrer, consultar e aproveitar o Observatório

    O Observatório Águas Amazônicas permite explorar informação sobre peixes, pesca e ecossistemas aquáticos da Amazônia a partir de diferentes portas de entrada: o buscador, os painéis de números, o mapa da bacia, as fichas de peixes e os conjuntos de dados. A exploração pode começar por uma espécie, uma sub-bacia ou a organização que contribuiu com os dados, e as visualizações se atualizam conforme os filtros aplicados.

    A informação selecionada é baixada por meio do GBIF com uma conta gratuita, e os filtros aplicados no Observatório são conservados no download. O guia de uso explica passo a passo cada ferramenta; o guia de estilo visual orienta o uso correto da identidade do Observatório em peças e comunicações.

