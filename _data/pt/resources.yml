publishing-guide-share:
  markdownContent: |
    As organizações parceiras da Aliança compartilham seus dados com o sistema ICTIO por meio da Secretaria Técnica. O processo tem quatro momentos:

    1. Preparação dos dados. A organização preenche a planilha de registros biológicos, que segue o padrão Darwin Core, e a planilha de metadados, que descreve quem gerou os dados, como, onde, quando e sob quais condições de uso.
    2. Envio pelo canal único. Ambos os arquivos são anexados no [mecanismo de carga do Observatório](https://forms.gle/zBebu9AxMLkxJ1Gm7). Cada envio corresponde a um único conjunto de dados com uma única declaração de metadados e condições; campanhas ou metodologias distintas são enviadas separadamente.
    3. Confirmação de recebimento. A Secretaria Técnica confirma o recebimento e verifica se a documentação está completa e se a estrutura é válida.
    4. Resultado da verificação. O aporte pode ser aceito, aceito com observações ou devolvido com indicações concretas para correção. As devoluções são apresentadas como apoio, não como rejeição.

    Cada organização conserva a titularidade sobre os dados que compartilha e pode solicitar a qualquer momento uma cópia do que foi aportado.

