terms-of-use-and-privacy-outro:
  markdownContent: |
    O Observatório não publica dados pessoais. Ainda assim, a Aliança trabalha para que as organizações que geram a informação sejam reconhecidas. A forma desse reconhecimento depende dos acordos locais que cada iniciativa estabelece no marco da Política de ética e governança de dados. Quando um trabalho requer informação com maior nível de detalhe, o procedimento é descrito na seção de Acesso a dados sensíveis, que explica como apresentar a solicitação à Secretaria Técnica.

###################################################
### FAQ. Página pt/about/faq.md
###################################################

faq-intro:
  markdownContent: |
    # Respostas rápidas sobre o Observatório, seus dados e as formas de participar

    ## O que é o Observatório Águas Amazônicas?

    É a janela de dados abertos da Aliança Águas Amazônicas. Reúne e disponibiliza informação sobre peixes, pesca e ecossistemas aquáticos da bacia amazônica. Hoje seu componente principal é o sistema ICTIO de monitoramento pesqueiro.

    ## Que informação o Observatório oferece?

    Registros biológicos de peixes, conjuntos de dados, painéis de indicadores, um mapa da bacia por sub-bacias e fichas de espécies prioritárias, além de guias e documentos sobre o uso e a gestão dos dados.

    ## De onde vêm os dados?

    Do monitoramento participativo e comunitário, de programas de ciência cidadã e dos monitoramentos das organizações e instituições parceiras da Aliança, seguindo os protocolos de monitoramento pesqueiro do ICTIO.

    ## Por que os registros não mostram coordenadas exatas?

    Para proteger sítios, espécies e pessoas, os dados públicos são apresentados agregados no nível de sub-bacia e sem dados pessoais. Quando uma finalidade legítima requer mais detalhe, o acesso pode ser solicitado conforme descrito em Acesso a dados sensíveis.

    ## De onde vem a informação geográfica sobre as bacias?

    A divisão em sub-bacias usada pelo Observatório baseia-se na classificação geográfica desenvolvida pela Aliança Águas Amazônicas. As principais bacias são descritas no [site da Aliança](https://pt.aguasamazonicas.org/bacia).

    ## Os dados do monitoramento participativo são confiáveis?

    Sim. Cada contribuição passa por revisão local das pessoas gestoras de dados e pela curadoria da Secretaria Técnica, que inclui validação taxonômica, geográfica e temporal. O processo é descrito em Qualidade de dados.

    ## Com que frequência a informação é atualizada?

    A informação é atualizada à medida que novos conjuntos de dados ou novas versões são integrados e publicados. Cada conjunto indica sua data de publicação e sua versão.

    ## É possível baixar os dados?

    Sim. Os downloads são feitos por meio do GBIF, com uma [conta gratuita](https://www.gbif.org/user/login). Nas páginas de registros, a opção «Baixar» redireciona para o GBIF.org e mantém os filtros aplicados no Observatório.

    ## Como os dados são citados?

    Os registros, conjuntos de dados e seus produtos derivados são citados segundo as orientações da Guia de citação, atribuição e reconhecimento.

    ## É necessário notificar o uso dos dados?

    A Aliança convida a fazê-lo. O link e o DOI do produto são enviados a [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org), o que permite devolver os resultados a quem gerou a informação.

    ## Por que os números dos Relatórios ICTIO não coincidem com os do Observatório?

    Os relatórios têm seu próprio nível de agregação e, em alguns casos, incorporam fontes complementares. Ambos os produtos são válidos e se complementam. Mais detalhes em [Relatórios ICTIO](/pt/resources/ictio-reports).

    ## Como uma organização pode compartilhar dados?

    As organizações parceiras da Aliança preenchem os modelos de registros biológicos e de metadados e os enviam à Secretaria Técnica. O passo a passo está na Guia de publicação. Organizações que não são parceiras e desejam contribuir com dados podem escrever a [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org).

    ## O que são os protocolos P76, P77, P78 e P79?

    São os quatro protocolos de monitoramento pesqueiro do ICTIO: durante a pescaria, depois da pescaria, no mercado e no porto. São descritos em Protocolos de coleta.

    ## É possível integrar os dados em outros sistemas?

    Sim, por meio da [API para desenvolvedores](/pt/resources/api-access), que permite consultar os dados publicados de forma automática.

    ## Como se reporta um erro ou se faz uma consulta?

    Os relatos e consultas são recebidos em [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org). Cada erro reportado contribui para melhorar a informação.

    ## Onde encontrar mais informação sobre a Aliança Águas Amazônicas?

    Em [aguasamazonicas.org](https://pt.aguasamazonicas.org/) apresentam-se sua estratégia, seus programas, seus parceiros e o Programa de Ciência Cidadã.
