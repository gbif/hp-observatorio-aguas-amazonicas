###################################################
### Observatório. Página pt/about/observatory.md
###################################################

observatory-intro:
  markdownContent: |
    # A janela de dados abertos da Aliança Águas Amazônicas

    Todos os dias, em rios, lagos, mercados e portos da Amazônia, alguém registra um peixe. Uma pescadora anota sua captura ao voltar da pescaria, um monitor comunitário documenta um desembarque, uma equipe técnica percorre um mercado. Cada um desses registros, por menor que pareça, é uma peça para entender como muda o maior ecossistema aquático do planeta. O Observatório Águas Amazônicas reúne essas peças e as disponibiliza a todas as pessoas.

    O Observatório é a janela de dados abertos da Aliança Águas Amazônicas: o lugar onde a informação que a Aliança gera e cuida se torna pública, consultável e reutilizável. Hoje seu componente principal é o sistema ICTIO, que reúne os dados do monitoramento pesqueiro da bacia. Esses dados vêm do monitoramento participativo e comunitário, de programas de ciência cidadã e dos monitoramentos realizados pelas mais de 30 organizações e instituições que integram a Aliança. No futuro, a janela se abrirá a outros componentes que a Aliança monitora e estuda, como a qualidade da água.

    Abrir os dados não significa expor quem os gera. Por isso, a informação do Observatório é publicada agregada no nível de sub-bacia, sem coordenadas exatas, para proteger sítios e recursos sensíveis, e é anonimizada quando necessário para proteger dados pessoais. Ao mesmo tempo, a Aliança trabalha para que as organizações locais que produzem a informação sejam reconhecidas e citadas em cada uso de seus dados. Proteger e reconhecer andam juntos.

    ## Por que monitorar a pesca na Amazônia?

    Os peixes são a base da alimentação, da economia e da cultura de milhões de pessoas na bacia amazônica. Algumas espécies, como os grandes bagres migratórios, percorrem milhares de quilômetros entre os Andes e o estuário, conectando países e ecossistemas. Saber quais espécies são pescadas, onde, quando e em que quantidade permite detectar mudanças a tempo, embasar decisões de manejo e conservação, e fortalecer a voz das comunidades pesqueiras nessas decisões.

    ## A Aliança Águas Amazônicas

    A Aliança Águas Amazônicas é uma iniciativa regional que concebe a bacia amazônica como um grande ecossistema aquático interconectado, que depende de suas florestas para manter sua integridade. Mais de 30 organizações dos países da bacia trabalham juntas para conservar seus rios, áreas úmidas e pescarias, com a Wildlife Conservation Society (WCS) como Secretaria Técnica. A estratégia, os programas, os parceiros e o restante do contexto da Aliança estão em seu site.

    [Conhecer a Aliança](https://pt.aguasamazonicas.org/a-alianca){:.button .is-primary target="_blank"}

    ## Os parceiros

    O Observatório é construído de forma colaborativa com organizações, instituições e parceiros da Aliança que contribuem com dados, pesquisas e conhecimento sobre os rios e ecossistemas amazônicos. Essa rede de colaboração permite consolidar informação diversa e atualizada para fortalecer a análise, a tomada de decisão e as ações de conservação na Amazônia.

    <img class="center" src="/assets/images/logos/banner-socios-Alianza-AA-2025-es.png" alt="Parceiros">

###################################################
### Ética e governança de dados. Página pt/about/governance.md
###################################################

governance-intro:
  markdownContent: |
    # Acordos compartilhados para cuidar dos dados e de quem os gera
    A governança do Observatório faz parte da governança geral da Aliança Águas Amazônicas. As mesmas instâncias que orientam a Aliança definem como o Observatório é gerido e opera: a **Assembleia Geral**, que reúne os parceiros e recebe a prestação de contas; o **Conselho Diretivo**, que aprova as políticas e resolve as decisões institucionais; o **Comitê de Infraestrutura de Dados**, que assessora em arquitetura, interoperabilidade, qualidade e segurança; o **Comitê de Conduta**, que examina com imparcialidade os casos que afetem direitos, dignidade ou confiança; e a **Secretaria Técnica**, a cargo da Wildlife Conservation Society (WCS), que coordena a aplicação cotidiana. Em cada iniciativa, as pessoas gestoras de dados mantêm o elo entre o território e a Secretaria Técnica.

    Essa governança parte de uma ideia: a autoridade sobre um dado nasce onde o dado é gerado. Cada comunidade, iniciativa e organização parceira conserva a governança sobre seus dados, e a Aliança a complementa sem substituí-la.

    ## Uma política para todos que usam os dados

    A Política de ética e governança de dados rege todas as instituições que fazem parte da Aliança e, ao mesmo tempo, oferece diretrizes para qualquer pessoa que use o Observatório ou seus dados. Estabelece os princípios, compromissos e responsabilidades que acompanham a informação em todo o seu ciclo de vida, desde o registro até a publicação, o uso e a conservação.

    Os dados que o Observatório integra chegam por duas vias. A maioria é publicada diretamente pela Aliança Águas Amazônicas, que assegura a rastreabilidade, o reconhecimento, o consentimento e os acordos com as comunidades. Outros vêm de publicadores que reconhecem esses mesmos princípios e aderem a eles.

    A Aliança está comprometida a trabalhar sob os princípios FAIR, para que os dados sejam localizáveis, acessíveis, interoperáveis e reutilizáveis, e sob os princípios CARE, que reconhecem o benefício coletivo, a autoridade para controlar, a responsabilidade e a ética no uso de dados de povos indígenas e comunidades locais. Essa combinação orienta o que a política chama de abertura situada: abrir os dados tanto quanto possível, considerando os direitos, os territórios, as relações de confiança e os riscos da divulgação.

