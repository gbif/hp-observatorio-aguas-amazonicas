explore:
  klass: features--explore
  title: Explora os dados
  description: |
    Acessa visualizações e ferramentas que permitem comprender a distribuição territorial dos registros e o crescimento da informação disponível no Observatório.
  features:
    - title: Guia de uso # required
      description: |      # required
        Aprenda a utilizar as ferramentas de pesquisa, os filtros e as opções de visualização disponíveis no Observatório.
      cta:  
      - text: Mais informações
        href: /pt/resources/use-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/explora_guia_de_uso.png
    - title: Territorio amazônico # required
      description: |      # required
        Explora os registros desde diferentes escalas territoriais da bacia amazônica.
      cta:
      - text: Mais informações
        href: /pt/stats/territory
        isPrimary: true  
      background: /assets/images/icons/explora_territorio_amazonico.png
    - title: O observatório em números # required
      description: |      # required
        Consulta indicadores do Sistema Ictio sobre monitoramento, participação e construção colaborativa de conhecimento.
      cta:
      - text: Mais informações
        href: /pt/occurrence/search?view=dashboard&layout=table_stateProvince_iucn*taxa.rank-SPECIES_gallery*map.h-500_year_occurrenceSummary_institutionCode
        isPrimary: true  
      background: /assets/images/icons/explora_obs_cifras.png