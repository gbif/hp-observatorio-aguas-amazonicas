##########################################################################
### Conteúdos das páginas em /taxa, na ordem em que aparecem
### no menu de navegação sob Taxa.
###
### Definidos em _data/pt/taxa.yml
### Cada seção é nomeada por página e tipo de conteúdo.
### Por exemplo:
### para discover.md: discover-intro, discover-cards, etc.
### Tipos de conteúdo:
### -intro: conteúdo introdutório em markdown
### -cards: conteúdo em features/cartões
### -links: conteúdo em links/botões
##########################################################################


###################################################
### Discover. Página pt/taxa/discover.md
###################################################

discover-intro:
  markdownContent: |
    A bacia amazônica abriga uma extraordinária diversidade de organismos que desempenham funções fundamentais nos ecossistemas aquáticos e terrestres. Desde grupos taxonômicos amplos até espécies de especial interesse para a conservação e o monitoramento, cada um contribui com informação valiosa para compreender a biodiversidade, as dinâmicas ecológicas e os processos que conectam os territórios amazônicos.

    Como parte de seus esforços para fortalecer a geração, integração e divulgação de conhecimento sobre a região, a Aliança Águas Amazônicas prioriza um conjunto de famílias, gêneros e espécies de peixes de especial relevância para os processos de monitoramento, pesquisa e conservação na bacia.

    Nesta seção você pode acessar tanto o conjunto de dados que documenta as fichas desses táxons quanto a lista das fichas e a descrição biológica de cada táxon.

