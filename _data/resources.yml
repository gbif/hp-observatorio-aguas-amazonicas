###################################################
### Guía de citación. Página citation.md
###################################################

citation-guide-intro:
  markdownContent: |
    # Reconocer a quienes hacen posible cada dato

    Detrás de cada registro del Observatorio hay personas pescadoras y monitoras, comunidades, organizaciones socias y equipos técnicos que observaron, registraron, validaron y cuidaron la información. Citar bien no es una formalidad bibliográfica: es la forma de mantener visible esa cadena de contribuciones, permitir que otras personas verifiquen los resultados y devolver valor a quienes generaron los datos.

    ## Guía de citación, atribución y reconocimiento

    La guía explica cómo citar cada tipo de recurso disponible en el Observatorio: el Observatorio mismo, un registro individual, un conjunto de datos, una descarga, un conjunto derivado, una fotografía, un mapa o una cifra de los paneles, y los productos derivados que se elaboren a partir de ellos. Su regla central es citar el recurso exacto que se utilizó. Mencionar a la Alianza, al Observatorio, a ICTIO o a GBIF no reemplaza la cita del conjunto o la descarga de dónde vienen los datos.

citation-guide-cards:
  klass: features--explore
  features:
    - title: Guía de citación, atribución y reconocimiento # required
      description: |      # required
        Orientaciones para citar datos, conjuntos, descargas y productos de la Alianza, y para reconocer las contribuciones de personas, comunidades y organizaciones.
      cta:  
      - text: Descargar guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png

citation-guide-datause:
  markdownContent: |
    ## Uso de los datos: notificación de uso y reúso

    La Alianza invita a notificar la publicación de artículos, informes, mapas, visualizaciones, materiales educativos, software u otros productos basados en datos del Observatorio. Conocer cómo se usan los datos permite a la Alianza devolver los resultados a las comunidades y organizaciones que los hicieron posibles.

    La notificación se envía a [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org) con la siguiente información:

    - título, tipo de producto, enlace público y DOI, si existe;
    - autoría, organización responsable y contacto;
    - datos o recursos utilizados, con su versión o DOI;
    - una descripción breve del uso realizado.

    Una notificación por producto es suficiente. No deben adjuntar datos restringidos ni información personal. La notificación es una buena práctica de reciprocidad: no reemplaza la cita ni es una condición para acceder a los datos o usarlos.

###################################################
### Calidad de datos. Página data-quality.md
###################################################

data-quality-intro:
  markdownContent: |
    # Datos participativos con procesos de curaduría que respaldan su confiabilidad

    ## ¿Qué significa calidad de datos en la Alianza Aguas Amazónicas?

    Buena parte de los datos del Observatorio nace del monitoreo participativo: personas pescadoras que registran sus capturas, monitores comunitarios, equipos locales en mercados y puertos, y organizaciones socias con sus propios programas de monitoreo pesquero. Que un dato venga de un proceso participativo no lo hace menos confiable. Lo que lo hace confiable es el camino de revisión que recorre antes de publicarse, y en la Alianza ese camino tiene varias manos.

    La primera revisión ocurre en el territorio, donde las personas gestoras de datos de cada iniciativa verifican que los registros estén completos y bien documentados. Luego, la Secretaría Técnica de la Alianza cura cada aporte: caracteriza el conjunto, normaliza formatos, detecta duplicados y aplica la validación taxonómica, para confirmar que los nombres científicos existan y correspondan a taxones aceptados, conservando siempre la identificación original y los nombres locales. También aplica la validación geográfica, para comprobar que las ubicaciones sean coherentes con el cuerpo de agua y el territorio declarados, y la validación temporal, para asegurar que las fechas sean posibles y consistentes. Cuando hace falta, se suma la revisión de especialistas temáticos.

    La Alianza evalúa la calidad en tres dimensiones: exactitud, consistencia y completitud. Y sigue un principio: la calidad no se corrige eliminando. Un registro con problemas se documenta, se intenta corregir junto con quien lo aportó y se clasifica según su aptitud, pero no se borra en silencio. Toda transformación queda registrada, de modo que cada dato publicado pueda explicarse.

    La calidad tampoco es un sí o un no. Un registro puede ser útil para un análisis y no para otro. Por eso se recomienda revisar los metadatos de cada conjunto, donde se describen su metodología, su cobertura y las protecciones aplicadas; por ejemplo, las ubicaciones públicas están agregadas a nivel de subcuenca y no representan coordenadas exactas.

    ## Herramientas para la calidad de datos

    **Para quienes usan los datos.** Antes del análisis, es recomendable revisar los metadatos del conjunto y las marcas de calidad que GBIF asigna a cada registro. Estas marcas señalan, por ejemplo, nombres que no coinciden con el catálogo taxonómico o coordenadas inconsistentes, y permiten filtrar los registros según el propósito del análisis.

    - [Requisitos de calidad de datos de GBIF](https://www.gbif.org/es/data-quality-requirements): qué se espera de un conjunto de ocurrencias publicado.
    - [Buscador de nombres de especies de GBIF](https://www.gbif.org/es/tools/species-lookup): verifica nombres científicos contra el catálogo taxonómico.

    **Para quienes generan o publican datos.** Estas herramientas libres ayudan a revisar los datos antes de enviarlos a la Secretaría Técnica:
    
    - [Validador de datos de GBIF](https://tools.gbif.org/es/tools/data-validator): revisa la estructura Darwin Core y detecta problemas antes de publicar.
    - [openRefine](https://openrefine.org/): verifica la estructura y contenido de los archivos EML.
    - [Guía de interoperabilidad de la Alianza](/resources/publishing-guide) (ver sección 2.2): describe los controles que se aplican a cada aporte.

    [Más herramientas de calidad](https://aguasamazonicas.org){:.button .is-primary target="_blank"}

data-quality-standards:
  markdownContent: |
    ## Estándares

    Los estándares son el lenguaje común que permite integrar datos de distintos países, organizaciones y metodologías en una misma infraestructura. El Observatorio usa tres:

