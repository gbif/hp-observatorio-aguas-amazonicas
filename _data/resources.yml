publishing-guide-share:
  markdownContent: |
    Las organizaciones socias de la Alianza comparten sus datos con el sistema ICTIO a través de la Secretaría Técnica. El proceso tiene cuatro momentos:

    1. Preparación de los datos. La organización diligencia la plantilla de registros biológicos, que sigue el estándar Darwin Core, y la plantilla de metadatos, que describe quién generó los datos, cómo, dónde, cuándo y bajo qué condiciones de uso.
    2.Envío por el canal único. Ambos archivos se adjuntan en el [mecanismo de carga del Observatorio](https://www.ictio.info/upload-data). Cada envío corresponde a un solo conjunto de datos con una sola declaración de metadatos y condiciones; las campañas o metodologías distintas se envían por separado.
    3. Confirmación de recepción. La Secretaría Técnica acusa recibo y verifica que la documentación esté completa y que la estructura sea válida.
    4. Resultado de la verificación. El aporte puede ser aceptado, aceptado con observaciones o devuelto con indicaciones concretas para su corrección. Las devoluciones se plantean como apoyo, no como rechazo.

    Cada organización conserva la titularidad sobre los datos que comparte y puede solicitar en cualquier momento una copia de lo aportado.

