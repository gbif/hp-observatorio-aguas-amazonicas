###################################################
### Guía de uso. Página use-guide.md
###################################################

use-guide-intro:
  markdownContent: |
    # Herramientas y orientaciones para recorrer, consultar y aprovechar el Observatorio

    El Observatorio Aguas Amazónicas permite explorar información sobre peces, pesca y ecosistemas acuáticos de la Amazonía desde distintas puertas de entrada: el buscador, los paneles de cifras, el mapa de la cuenca, las fichas de peces y los conjuntos de datos. La exploración puede comenzar por una especie, una subcuenca o la organización que aportó los datos, y las visualizaciones se actualizan según los filtros aplicados.

    La información seleccionada se descarga a través de GBIF con una cuenta gratuita, y los filtros aplicados en el Observatorio se conservan en la descarga. La guía de uso explica paso a paso cada herramienta; la guía de estilo visual orienta el uso correcto de la identidad del Observatorio en piezas y comunicaciones.

use-guide-cards:
  klass: features--explore
  features:
    - title: Guía de uso del Observatorio # required
      description: |      # required
        Explica cómo navegar el Observatorio, usar el buscador y los filtros, explorar los paneles de datos y descargar información.
      cta:  
      - text: Descargar guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png
    - title: Guía de estilo visual # required
      description: |      # required
        Reúne las orientaciones para usar correctamente la identidad visual del Observatorio: identificadores, colores, tipografías, recursos gráficos y criterios de aplicación en diferentes piezas y medios.
      cta:  
      - text: Descargar guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png

###################################################
### Publicación de datos. Página publishing-guide.md
###################################################

publishing-guide-intro:
  markdownContent: |
    # Cómo llegan los datos de las organizaciones socias al Observatorio y al mundo

    La interoperabilidad permite que los conjuntos de datos producidos por distintas organizaciones, con métodos, escalas y herramientas diferentes, se integren, interpreten y reutilicen de forma conjunta. En la Alianza Aguas Amazónicas se aborda en cuatro dimensiones: legal (licencias, condiciones de uso y acuerdos), organizacional (roles y responsabilidades), semántica (estándar común, vocabularios controlados y metadatos) y técnica (formatos abiertos, identificadores persistentes y acceso programático). El modelo no centraliza la información ni homogeniza las prácticas de campo: cada organización conserva la titularidad y el control sobre sus datos, y su contribución queda trazada a lo largo de todo el ciclo.

    ## Ciclo de la información: de la organización socia a GBIF

    Todo registro publicado en el Observatorio atraviesa seis etapas:

    1. Compartir. La organización socia entrega el conjunto estructurado en la plantilla Darwin Core, con sus metadatos y la declaración de licencia, restricciones e información sensible.
    2. Custodiar. La Secretaría Técnica verifica la validez formal del aporte y conserva el original sin modificaciones y con acceso restringido (nivel 0).
    3. Integrar. El aporte se incorpora al conjunto interno acumulativo, conservando el identificador del aporte, la organización de origen y la fecha de recepción.
    4. Validar. Se aplican perfilamiento, normalización, validación taxonómica, geográfica y temporal, y detección de duplicados; cada transformación se documenta.
    5. Proteger. Se anonimizan los datos personales y se generaliza la ubicación a nivel de subcuenca, lo que genera versiones de acceso controlado (niveles 1 y 2).
    6. Publicar. Con la autorización de la Secretaría Técnica, se genera la versión de acceso abierto (nivel 3).

