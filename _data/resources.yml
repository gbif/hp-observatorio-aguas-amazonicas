standards:
  title: Estándares usados en el observatorio
  features:
    - title: Darwin Core (DwC) # required
      description: |      # required
        Es el estándar utilizado para estructurar y publicar registros biológicos. Permite documentar información relacionada con especies, observaciones, eventos de muestreo, ubicación geográfica, fechas, personas e instituciones asociadas a los registros, facilitando el intercambio de datos sobre biodiversidad entre diferentes plataformas y organizaciones.
      href: https://dwc.tdwg.org/es/
      cta:
      - text: Más información
        href: https://dwc.tdwg.org/es/
        isPrimary: true      
      # img required
      background: /assets/images/icons/estandar_dwc.png
    - title: Ecological Metadata Language (EML) # required
      description: |      # required
        Es el estándar utilizado para documentar los metadatos asociados a los conjuntos de datos. Proporciona información sobre el origen de los datos, métodos de recopilación, cobertura geográfica y temporal, responsables, licencias y otros elementos necesarios para comprender el contexto en que la información fue generada.
      href: https://eml.ecoinformatics.org/
      cta:
      - text: Más información
        href: https://eml.ecoinformatics.org/
        isPrimary: true  
      background: /assets/images/icons/estandar_eml.png
    - title: Plinian Core (PliC) # required
      description: |      # required
        Es el estándar utilizado para estructurar fichas de especies y otros contenidos taxonómicos. Permite organizar información descriptiva relacionada con taxonomía, distribución, ecología, conservación, usos y otros atributos asociados a especies o grupos biológicos.
      href: https://www.tdwg.org/community/species/plinian-core/
      cta:
      - text: Más información
        href: https://www.tdwg.org/community/species/plinian-core/
        isPrimary: true  
      background: /assets/images/icons/estandar_plic.png

standards-after:
  markdownContent: |
    ## ¿Por qué son importantes los estándares?

    Los estándares permiten que la información generada por múltiples actores pueda integrarse en una infraestructura común, facilitando su consulta y reutilización. Gracias a este lenguaje compartido, el Observatorio puede conectar registros biológicos, fichas taxonómicas, conjuntos de datos, recursos multimedia y otros contenidos provenientes de diferentes fuentes, fortaleciendo la gestión del conocimiento sobre la cuenca amazónica y promoviendo el acceso abierto a la información.

protocols:
  klass: features--explore
  description: |
    Cada protocolo responde a un contexto específico de observación y registro, permitiendo complementar la información obtenida desde diferentes puntos de la cadena pesquera:
  features:
    - title: Durante la faena - P76 # required
      description: |      # required
        Registra peces observados o capturados directamente durante la actividad de pesca. Este protocolo permite documentar información asociada al momento de captura, incluyendo datos sobre la ubicación, fecha y características del evento cuando se encuentran disponibles.     
      # img required
      background: /assets/images/icons/protocolo_p76.png
    - title: Después de la faena - P77 # required
      description: |      # required
        Permite registrar información reportada después de finalizar la actividad de pesca. Los datos son aportados por personas pescadoras, monitoras o equipos locales y complementan la información obtenida durante las jornadas de monitoreo.
      background: /assets/images/icons/protocolo_p77.png
    - title: Mercado - P78 # required
      description: |      # required
        Corresponde a registros realizados en mercados de peces, donde se documentan especies observadas o comercializadas. Este tipo de información permite conocer la diversidad de especies presentes en los circuitos de comercialización, aunque no siempre es posible determinar con precisión el lugar de captura.
      background: /assets/images/icons/protocolo_p78.png
    - title: Puerto - P79 # required
      description: |      # required
        Incluye registros obtenidos durante actividades de monitoreo en puertos y desembarques pesqueros. Dependiendo de la información disponible, estos registros pueden aportar datos sobre el origen de las capturas, las especies desembarcadas y otros aspectos relacionados con la actividad pesquera.
      background: /assets/images/icons/protocolo_p79.png

protocols-after:
  markdownContent: |
    La integración de estos protocolos permite construir una visión más amplia de la diversidad de peces presentes en la cuenca amazónica y fortalecer los procesos de monitoreo participativo impulsados por organizaciones, comunidades y equipos técnicos vinculados a la conservación de los ecosistemas acuáticos.

data-quality-manual:
  klass: features--explore
  features:
    - title: Calidad de datos # required
      description: |      # required
        A continuación, encontrarás los documentos y orientaciones relacionadas con los procesos de revisión y fortalecimiento de calidad de datos implementados dentro del Observatorio.
      cta:  
      - text: Más información
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/calidad_datos.png

api:
  markdownContent: |
    <img class="center" src="/assets/images/icons/icono_api.png" alt="Api para desarrolladores">  
    A continuación se presenta la documentación técnica donde encontraran endpoints, ejemplos de consulta y lineamientos necesarios para el uso e integración de la API dentro de desarrollos y proyectos asociados al ecosistema de datos del Observatorio.
    <br>
    [Mas información](/about){:.button}

identity-manual:
  klass: features--explore
  features:
    - title: Manual de identidad visual del Observatorio de Aguas Amazónicas # required
      description: |      # required
        Lineamientos para la aplicación coherente de la identidad visual en entornos digitales, editoriales y gráficos.
      cta:  
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png

publishing-guide:
  klass: features--explore
  title: Recursos para publicar datos
  features:
    - title: Guía de publicación # required
      description: |      # required
        Consulta el paso a paso y las orientaciones técnicas para preparar, documentar y enviar un conjunto de datos al Observatorio. La guía incluye recomendaciones para diligenciar correctamente los formatos requeridos y facilitar el proceso de revisión e incorporación de la información.
      cta:  
      - text: Ver guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/publicacion_guia.png
    - title: Plantilla de metadatos # required
      description: |      # required
        Descarga la plantilla para registrar la información descriptiva del conjunto de datos, incluyendo aspectos como autoría, cobertura, metodología, calidad de los datos y demás elementos necesarios para su documentación.
      cta:  
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/publicacion_metadatos.png
    - title: Plantilla de carga de datos # required
      description: |      # required
        Descarga la plantilla para registrar los datos de biodiversidad y monitoreo de los ecosistemas acuáticos amazónicos que serán incorporados al Observatorio.
      cta:  
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/publicacion_plantilla.png

publishing-upload:
  klass: splitBanner--contain
  reverse: false
  title: Cargar datos al Observatorio
  description: |
      Una vez diligenciado la Plantilla de metadatos y la Plantilla de carga de datos, adjunta ambos archivos mediante el siguiente formulario para iniciar el proceso.
  background: /assets/images/icons/publicacion_upload.png
  cta: 
    - text: Cargar
      href: /resources/protocols

publishing-upload-after:
  markdownContent: |
    Una vez enviados los archivos, el administrador de la base de datos revisará y validará la información. Si cumple con los criterios de calidad establecidos, realizará la incorporación del conjunto de datos y su publicación en el Observatorio.
