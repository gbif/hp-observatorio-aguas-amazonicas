###################################################
### Protocolos. Página protocols.md
###################################################

protocols-intro:
  markdownContent: |
    # Acuerdos comunes para observar y registrar la pesca en toda la cuenca

    Para que datos tomados en ríos, mercados y puertos de distintos países puedan compararse, primero hay que ponerse de acuerdo en qué observar y cómo registrarlo. En la Alianza Aguas Amazónicas, ese acuerdo lo construye colaborativamente el Grupo de Pesca, un grupo interinstitucional que define las variables esenciales que se registran en los diferentes mecanismos de monitoreo de la Alianza.

    De ese trabajo surgen los cuatro protocolos del sistema ICTIO. Cada uno responde a un momento distinto de la cadena pesquera y, juntos, ofrecen una visión más amplia de la diversidad de peces de la cuenca y de las dinámicas de la pesca.


protocols-cards:
  klass: features--explore
  description: |
    Cada protocolo responde a un contexto específico de observación y registro, permitiendo complementar la información obtenida desde diferentes puntos de la cadena pesquera:
  features:
    - title: P76 – Durante la faena # required
      description: |      # required
        Registra los peces observados o capturados directamente durante la actividad de pesca. Documenta información del momento de captura, como la ubicación, la fecha y las características del evento cuando están disponibles.     
      # img required
      background: /assets/images/icons/protocolo_p76.png
    - title: P77 – Después de la faena # required
      description: |      # required
        Registra la información reportada una vez termina la actividad de pesca. Los datos los aportan personas pescadoras, monitoras o equipos locales, y complementan lo obtenido durante las jornadas de monitoreo.
      background: /assets/images/icons/protocolo_p77.png
    - title: P78 – Mercado # required
      description: |      # required
        Registra las especies observadas o comercializadas en mercados de pescado. Permite conocer la diversidad de especies que circulan en la comercialización, aunque no siempre es posible determinar con precisión el lugar de captura.
      background: /assets/images/icons/protocolo_p78.png
    - title: P79 – Puerto # required
      description: |      # required
        Registra información obtenida en puertos y desembarques pesqueros. Según la información disponible, aporta datos sobre el origen de las capturas, las especies desembarcadas y otros aspectos de la actividad pesquera.
      background: /assets/images/icons/protocolo_p79.png

protocols-files-link:
  markdownContent: |
    [Ver protocolos](https://aguasamazonicas.org){:.button .is-primary target="_blank"}
    
