##########################################################################
### Contenidos de las páginas debajo de /resources
###
### Se definen en el archivo _data/resources.yml
### Cada sección se define con un nombre de página y un contenido en yaml.
### por ejemplo:
### para use-guide.md se define use-guide-intro, use-guide-cards, etc.
### Se indica el tipo de contenido:
### -intro: para contenido introductorio en markdown
### -cards: para contenido en features/tarjetas
### -links: para contenido en enlaces/botones
##########################################################################


###################################################
### Guía de uso. Página use-guide.md
###################################################

use-guide-intro:
  markdownContent: |
    # Herramientas y orientaciones para recorrer, consultar y aprovechar el Observatorio

    El Observatorio Aguas Amazónicas permite explorar información sobre peces, pesca y ecosistemas acuáticos de la Amazonía desde distintas puertas de entrada: el buscador, los paneles de cifras, el mapa de la cuenca, las fichas de peces y los conjuntos de datos. La exploración puede comenzar por una especie, una subcuenca o la organización que aportó los datos, y las visualizaciones se actualizan según los filtros aplicados.

    La información seleccionada se descarga a través de GBIF con una cuenta gratuita, y los filtros aplicados en el Observatorio se conservan en la descarga. La guía de uso explica paso a paso cada herramienta; la guía de estilo visual orienta el uso correcto de la identidad del Observatorio en piezas y comunicaciones.

use-guide-cards:
  klass: features--explore
  features:
    - title: Guía de uso del Observatorio # required
      description: |      # required
        Explica cómo navegar el Observatorio, usar el buscador y los filtros, explorar los paneles de datos y descargar información.
      cta:  
      - text: Descargar guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png
    - title: Guía de estilo visual # required
      description: |      # required
        Reúne las orientaciones para usar correctamente la identidad visual del Observatorio: identificadores, colores, tipografías, recursos gráficos y criterios de aplicación en diferentes piezas y medios.
      cta:  
      - text: Descargar guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png

###################################################
### Publicación de datos. Página publishing-guide.md
###################################################

publishing-guide-intro:
  markdownContent: |
    # Cómo llegan los datos de las organizaciones socias al Observatorio y al mundo

    La interoperabilidad permite que los conjuntos de datos producidos por distintas organizaciones, con métodos, escalas y herramientas diferentes, se integren, interpreten y reutilicen de forma conjunta. En la Alianza Aguas Amazónicas se aborda en cuatro dimensiones: legal (licencias, condiciones de uso y acuerdos), organizacional (roles y responsabilidades), semántica (estándar común, vocabularios controlados y metadatos) y técnica (formatos abiertos, identificadores persistentes y acceso programático). El modelo no centraliza la información ni homogeniza las prácticas de campo: cada organización conserva la titularidad y el control sobre sus datos, y su contribución queda trazada a lo largo de todo el ciclo.

    ## Ciclo de la información: de la organización socia a GBIF

    Todo registro publicado en el Observatorio atraviesa seis etapas:

    1. Compartir. La organización socia entrega el conjunto estructurado en la plantilla Darwin Core, con sus metadatos y la declaración de licencia, restricciones e información sensible.
    2. Custodiar. La Secretaría Técnica verifica la validez formal del aporte y conserva el original sin modificaciones y con acceso restringido (nivel 0).
    3. Integrar. El aporte se incorpora al conjunto interno acumulativo, conservando el identificador del aporte, la organización de origen y la fecha de recepción.
    4. Validar. Se aplican perfilamiento, normalización, validación taxonómica, geográfica y temporal, y detección de duplicados; cada transformación se documenta.
    5. Proteger. Se anonimizan los datos personales y se generaliza la ubicación a nivel de subcuenca, lo que genera versiones de acceso controlado (niveles 1 y 2).
    6. Publicar. Con la autorización de la Secretaría Técnica, se genera la versión de acceso abierto (nivel 3).

publishing-guide-cards:
  klass: features--explore
  features:
    - title: Guía de interoperabilidad # required
      description: |      # required
        Lineamientos de la Alianza para compartir, estandarizar, validar, proteger y preparar conjuntos de datos para el acceso abierto.
      cta:  
      - text: Ver guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/publicacion_guia.png

publishing-guide-share:
  markdownContent: |
    Las organizaciones socias de la Alianza comparten sus datos con el sistema ICTIO a través de la Secretaría Técnica. El proceso tiene cuatro momentos:

    1. Preparación de los datos. La organización diligencia la plantilla de registros biológicos, que sigue el estándar Darwin Core, y la plantilla de metadatos, que describe quién generó los datos, cómo, dónde, cuándo y bajo qué condiciones de uso.
    2.Envío por el canal único. Ambos archivos se adjuntan en el [mecanismo de carga del Observatorio](https://www.ictio.info/upload-data). Cada envío corresponde a un solo conjunto de datos con una sola declaración de metadatos y condiciones; las campañas o metodologías distintas se envían por separado.
    3. Confirmación de recepción. La Secretaría Técnica acusa recibo y verifica que la documentación esté completa y que la estructura sea válida.
    4. Resultado de la verificación. El aporte puede ser aceptado, aceptado con observaciones o devuelto con indicaciones concretas para su corrección. Las devoluciones se plantean como apoyo, no como rechazo.

    Cada organización conserva la titularidad sobre los datos que comparte y puede solicitar en cualquier momento una copia de lo aportado.

publishing-guide-files-cards:
  klass: features--explore
  features:
    - title: Plantilla de registros biológicos # required
      description: |      # required
        Plantilla estandarizada en Darwin Core para registrar la información que será evaluada e incorporada al sistema ICTIO.
      cta:  
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/publicacion_plantilla.png
    - title: Plantilla de metadatos # required
      description: |      # required
        Plantilla para documentar el conjunto de datos: autoría, cobertura, metodología, calidad, licencia y condiciones de uso.
      cta:  
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/publicacion_metadatos.png

###################################################
### Guía de citación. Página citation.md
###################################################

citation-guide-intro:
  markdownContent: |
    # Reconocer a quienes hacen posible cada dato

    Detrás de cada registro del Observatorio hay personas pescadoras y monitoras, comunidades, organizaciones socias y equipos técnicos que observaron, registraron, validaron y cuidaron la información. Citar bien no es una formalidad bibliográfica: es la forma de mantener visible esa cadena de contribuciones, permitir que otras personas verifiquen los resultados y devolver valor a quienes generaron los datos.

    ## Guía de citación, atribución y reconocimiento

    La guía explica cómo citar cada tipo de recurso disponible en el Observatorio: el Observatorio mismo, un registro individual, un conjunto de datos, una descarga, un conjunto derivado, una fotografía, un mapa o una cifra de los paneles, y los productos derivados que se elaboren a partir de ellos. Su regla central es citar el recurso exacto que se utilizó. Mencionar a la Alianza, al Observatorio, a ICTIO o a GBIF no reemplaza la cita del conjunto o la descarga de dónde vienen los datos.

citation-guide-cards:
  klass: features--explore
  features:
    - title: Guía de citación, atribución y reconocimiento # required
      description: |      # required
        Orientaciones para citar datos, conjuntos, descargas y productos de la Alianza, y para reconocer las contribuciones de personas, comunidades y organizaciones.
      cta:  
      - text: Descargar guía
        href: /resources/usage-guide
        isPrimary: true      
      # img required
      background: /assets/images/icons/icono_api.png

citation-guide-datause:
  markdownContent: |
    ## Uso de los datos: notificación de uso y reúso

    La Alianza invita a notificar la publicación de artículos, informes, mapas, visualizaciones, materiales educativos, software u otros productos basados en datos del Observatorio. Conocer cómo se usan los datos permite a la Alianza devolver los resultados a las comunidades y organizaciones que los hicieron posibles.

    La notificación se envía a [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org) con la siguiente información:

    - título, tipo de producto, enlace público y DOI, si existe;
    - autoría, organización responsable y contacto;
    - datos o recursos utilizados, con su versión o DOI;
    - una descripción breve del uso realizado.

    Una notificación por producto es suficiente. No deben adjuntar datos restringidos ni información personal. La notificación es una buena práctica de reciprocidad: no reemplaza la cita ni es una condición para acceder a los datos o usarlos.

###################################################
### Calidad de datos. Página data-quality.md
###################################################

data-quality-intro:
  markdownContent: |
    # Datos participativos con procesos de curaduría que respaldan su confiabilidad

    ## ¿Qué significa calidad de datos en la Alianza Aguas Amazónicas?

    Buena parte de los datos del Observatorio nace del monitoreo participativo: personas pescadoras que registran sus capturas, monitores comunitarios, equipos locales en mercados y puertos, y organizaciones socias con sus propios programas de monitoreo pesquero. Que un dato venga de un proceso participativo no lo hace menos confiable. Lo que lo hace confiable es el camino de revisión que recorre antes de publicarse, y en la Alianza ese camino tiene varias manos.

    La primera revisión ocurre en el territorio, donde las personas gestoras de datos de cada iniciativa verifican que los registros estén completos y bien documentados. Luego, la Secretaría Técnica de la Alianza cura cada aporte: caracteriza el conjunto, normaliza formatos, detecta duplicados y aplica la validación taxonómica, para confirmar que los nombres científicos existan y correspondan a taxones aceptados, conservando siempre la identificación original y los nombres locales. También aplica la validación geográfica, para comprobar que las ubicaciones sean coherentes con el cuerpo de agua y el territorio declarados, y la validación temporal, para asegurar que las fechas sean posibles y consistentes. Cuando hace falta, se suma la revisión de especialistas temáticos.

    La Alianza evalúa la calidad en tres dimensiones: exactitud, consistencia y completitud. Y sigue un principio: la calidad no se corrige eliminando. Un registro con problemas se documenta, se intenta corregir junto con quien lo aportó y se clasifica según su aptitud, pero no se borra en silencio. Toda transformación queda registrada, de modo que cada dato publicado pueda explicarse.

    La calidad tampoco es un sí o un no. Un registro puede ser útil para un análisis y no para otro. Por eso se recomienda revisar los metadatos de cada conjunto, donde se describen su metodología, su cobertura y las protecciones aplicadas; por ejemplo, las ubicaciones públicas están agregadas a nivel de subcuenca y no representan coordenadas exactas.

    ## Herramientas para la calidad de datos

    **Para quienes usan los datos.** Antes del análisis, es recomendable revisar los metadatos del conjunto y las marcas de calidad que GBIF asigna a cada registro. Estas marcas señalan, por ejemplo, nombres que no coinciden con el catálogo taxonómico o coordenadas inconsistentes, y permiten filtrar los registros según el propósito del análisis.

    - [Requisitos de calidad de datos de GBIF](https://www.gbif.org/es/data-quality-requirements): qué se espera de un conjunto de ocurrencias publicado.
    - [Buscador de nombres de especies de GBIF](https://www.gbif.org/es/tools/species-lookup): verifica nombres científicos contra el catálogo taxonómico.

    **Para quienes generan o publican datos.** Estas herramientas libres ayudan a revisar los datos antes de enviarlos a la Secretaría Técnica:
    
    - [Validador de datos de GBIF](https://tools.gbif.org/es/tools/data-validator): revisa la estructura Darwin Core y detecta problemas antes de publicar.
    - [openRefine](https://openrefine.org/): verifica la estructura y contenido de los archivos EML.
    - [Guía de interoperabilidad de la Alianza](/resources/publishing-guide) (ver sección 2.2): describe los controles que se aplican a cada aporte.

    [Más herramientas de calidad](https://aguasamazonicas.org){:.button .is-primary target="_blank"}

data-quality-standards:
  markdownContent: |
    ## Estándares

    Los estándares son el lenguaje común que permite integrar datos de distintos países, organizaciones y metodologías en una misma infraestructura. El Observatorio usa tres:

data-quality-standards-cards:
  klass: features--explore
  features:
    - title: Darwin Core (DwC) # required
      description: |      # required
        Estándar para estructurar y publicar registros biológicos: especie, evento, ubicación, fecha, personas e instituciones asociadas.
      cta:
      - text: Más información
        href: https://dwc.tdwg.org/es/
        isPrimary: true      
      # img required
      background: /assets/images/icons/estandar_dwc.png
    - title: Ecological Metadata Language (EML) # required
      description: |      # required
        Estándar para documentar los metadatos de los conjuntos de datos: origen, métodos, cobertura, responsables y licencia.
      cta:
      - text: Más información
        href: https://eml.ecoinformatics.org/
        isPrimary: true  
      background: /assets/images/icons/estandar_eml.png
    - title: Plinian Core (PliC) # required
      description: |      # required
        Estándar para estructurar fichas de especies: taxonomía, distribución, ecología, conservación y usos.
      cta:
      - text: Más información
        href: https://www.tdwg.org/community/species/plinian-core/
        isPrimary: true  
      background: /assets/images/icons/estandar_plic.png

###################################################
### Protocolos. Página protocols.md
###################################################

protocols-intro:
  markdownContent: |
    # Acuerdos comunes para observar y registrar la pesca en toda la cuenca

    Para que datos tomados en ríos, mercados y puertos de distintos países puedan compararse, primero hay que ponerse de acuerdo en qué observar y cómo registrarlo. En la Alianza Aguas Amazónicas, ese acuerdo lo construye colaborativamente el Grupo de Pesca, un grupo interinstitucional que define las variables esenciales que se registran en los diferentes mecanismos de monitoreo de la Alianza.

    De ese trabajo surgen los cuatro protocolos del sistema ICTIO. Cada uno responde a un momento distinto de la cadena pesquera y, juntos, ofrecen una visión más amplia de la diversidad de peces de la cuenca y de las dinámicas de la pesca.

protocols-cards:
  klass: features--explore
  description: |
    Cada protocolo responde a un contexto específico de observación y registro, permitiendo complementar la información obtenida desde diferentes puntos de la cadena pesquera:
  features:
    - title: P76 – Durante la faena # required
      description: |      # required
        Registra los peces observados o capturados directamente durante la actividad de pesca. Documenta información del momento de captura, como la ubicación, la fecha y las características del evento cuando están disponibles.     
      # img required
      background: /assets/images/icons/protocolo_p76.png
    - title: P77 – Después de la faena # required
      description: |      # required
        Registra la información reportada una vez termina la actividad de pesca. Los datos los aportan personas pescadoras, monitoras o equipos locales, y complementan lo obtenido durante las jornadas de monitoreo.
      background: /assets/images/icons/protocolo_p77.png
    - title: P78 – Mercado # required
      description: |      # required
        Registra las especies observadas o comercializadas en mercados de pescado. Permite conocer la diversidad de especies que circulan en la comercialización, aunque no siempre es posible determinar con precisión el lugar de captura.
      background: /assets/images/icons/protocolo_p78.png
    - title: P79 – Puerto # required
      description: |      # required
        Registra información obtenida en puertos y desembarques pesqueros. Según la información disponible, aporta datos sobre el origen de las capturas, las especies desembarcadas y otros aspectos de la actividad pesquera.
      background: /assets/images/icons/protocolo_p79.png

protocols-files-link:
  markdownContent: |
    [Ver protocolos](https://aguasamazonicas.org){:.button .is-primary target="_blank"}

###################################################
### Acceso a datos sensibles. Página sensitive-information.md
###################################################

sensitive-information-intro:
  markdownContent: |
    # Tan abiertos como sea posible, tan protegidos como sea necesario

    Los datos del sistema ICTIO no existen en una sola versión. Algunos detalles, como las coordenadas exactas de un sitio de pesca o la identidad de quien registró una captura, podrían afectar a personas, comunidades o especies si se publicaran sin cuidado. Por eso ICTIO organiza sus datos en cuatro niveles de acceso. Cada nivel es una versión distinta del mismo recurso, y abrir un nivel nunca ocurre de forma automática.

sensitive-information-cards:
  klass: features--explore
  features:
    - title: Niveles de acceso de los datos del sistema ICTIO # required
      description: |      # required
        Modelo completo de niveles de acceso, almacenamiento y licenciamiento, con las transiciones permitidas entre niveles.   
      cta:
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true  
      background: /assets/images/icons/protocolo_p76.png

sensitive-information-howto:
  markdownContent: |
    ## ¿Cómo acceder a datos sensibles del sistema ICTIO?

    Cuando una investigación, un proyecto de conservación o un análisis técnico requiere más detalle del disponible públicamente, es posible solicitar acceso al nivel 2, es decir al conjunto de datos con las coordenadas de los registros. Las personas u organizaciones interesadas deben enviar una solicitud formal a la Secretaría Técnica de la Alianza Aguas Amazónicas al correo [observatorio@aguasamazonicas.org](mailto:observatorio@aguasamazonicas.org), usando el formato del [Acuerdo para compartir datos](/resources/usage-guide).

    La Secretaría Técnica revisa cada solicitud junto con el custodio de los datos cuando corresponde. Si se aprueba, el acceso se formaliza con un acuerdo que define la finalidad, el alcance, el plazo, las medidas de seguridad y las restricciones de redistribución. Si no puede aprobarse, la decisión se comunica de forma motivada.

    Acceder a datos de nivel 2 conlleva los mismos compromisos de reconocimiento que cualquier uso del Observatorio, y algunos más. Antes de enviar la solicitud, se recomienda revisar la [sección 2.3 de la Guía de citación / Uso de datos](/resources/citation-guide), donde se explica cómo citar el conjunto y su DOI, cómo reconocer a las organizaciones y comunidades que generaron la información, y cómo notificar el uso y reúso de los productos obtenidos.
 
sensitive-information-howto-cards:
  klass: features--explore
  features:
    - title: Acuerdo para compartir datos a nivel de iniciativa u organización # required
      description: |      # required
        Formato para solicitar y formalizar el acceso a datos de acceso controlado.   
      cta:
      - text: Descargar
        href: /resources/usage-guide
        isPrimary: true  
      background: /assets/images/icons/protocolo_p76.png  

###################################################
### Informes ICTIO. Página ictio-reports.md
###################################################

ictio-reports-intro:
  markdownContent: |
    # Una mirada panorámica al monitoreo pesquero en la cuenca amazónica

    Los Informes ICTIO son la lectura que hace la Secretaría Técnica de la Alianza Aguas Amazónicas sobre el estado del monitoreo pesquero en la cuenca. A partir de los datos del sistema ICTIO, reúnen cifras, tendencias y avances, y hacen visibles los aportes de las comunidades, organizaciones e instituciones que generan la información. Tienen un propósito divulgativo, por eso se presentan en formatos pensados para compartir, como infografías y reportes periódicos.

    Los informes trabajan con un nivel de agregación propio y, en algunos casos, incorporan fuentes de datos complementarias a las del Observatorio. Por eso sus cifras no siempre coinciden con las de los paneles del Observatorio. Ambos productos son válidos y se complementan: el Observatorio muestra los registros publicados y consultables; los informes ofrecen una lectura de conjunto para entender el panorama del monitoreo pesquero.

    Los Informes ICTIO se publican en el sitio web de la [Alianza Aguas Amazónicas](https://aguasamazonicas.org/informe-ictio){:target="_blank"}.

ictio-reports-cards:
  klass: features--explore
  features:
    - title: Informes ICTIO # required
      description: |      # required
        Informes e infografías del monitoreo pesquero de ICTIO, disponibles para consulta y descarga.   
      cta:
      - text: Ver informes
        href: https://aguasamazonicas.org/informe-ictio
        isPrimary: true  
      background: /assets/images/icons/protocolo_p76.png

###################################################
### API para desarrolladores. Página api-access.md
###################################################

api-access-intro:
  markdownContent: |
    # Integración de los datos del Observatorio en sistemas, aplicaciones y visualizaciones.

    La API permite a organizaciones socias, equipos técnicos y desarrolladores consultar de forma automática los datos publicados en el Observatorio, sin descargas manuales. A través de ella es posible acceder a la información de biodiversidad y monitoreo pesquero del sistema ICTIO e integrarla en tableros que se actualizan solos, análisis reproducibles o cruces con otras fuentes de la cuenca.

    La documentación técnica presenta los endpoints disponibles, ejemplos de consulta y los lineamientos para usar la API. Los datos consultados por esta vía mantienen las mismas condiciones de uso y cita que el resto del Observatorio.

    [Ver documentación de la API](https://techdocs.gbif.org/en/openapi/v1/occurrence){:.button .is-primary target="_blank"}

